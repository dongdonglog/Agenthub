name: Feature request
description: 提出功能或改进建议
title: "[feat] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述场景与痛点，而不是直接给方案
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案 / 取舍
  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 已搜索过已有 Issue 与路线图
          required: true
