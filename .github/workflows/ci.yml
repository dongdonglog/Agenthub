name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: web deps
        working-directory: web
        run: npm ci
      - name: web build
        working-directory: web
        run: npm run build
      - name: web test
        working-directory: web
        run: npm test
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...
      - name: test-race
        run: go test -race ./...
      - name: build
        run: CGO_ENABLED=0 go build -trimpath ./...
