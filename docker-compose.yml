# AgentHub 部署：应用 + PostgreSQL
#
#   cp .env.example .env    # 填 FEISHU_* 与 POSTGRES_PASSWORD
#   docker compose up -d --build
#
# 端口可用环境变量覆盖：AGENTHUB_HTTP_PORT / AGENTHUB_ADMIN_PORT
# 冒烟（不接飞书）：COMPOSE_CHANNEL=off docker compose up -d
services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?需要设置 POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      AGENTHUB_DB_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/postgres?sslmode=disable
      AGENTHUB_DATA_DIR: /data
      AGENTHUB_HTTP_ADDR: 0.0.0.0:8787
      AGENTHUB_ADMIN_ADDR: 0.0.0.0:8788
      AGENTHUB_CHANNEL: ${COMPOSE_CHANNEL:-feishu}
    ports:
      - "127.0.0.1:${AGENTHUB_HTTP_PORT:-8787}:8787"
      - "127.0.0.1:${AGENTHUB_ADMIN_PORT:-8788}:8788"
    volumes:
      - aadata:/data
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "/app/agentd", "-healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    mem_limit: 1g
    cpus: 2
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  pgdata:
  aadata:
